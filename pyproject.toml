[project]
readme = "README.md"
name = "lm-mem"
version = "0.4.0"
description = "本地语义记忆 MCP Server — 跨会话持久化,语义检索"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "chromadb>=0.5.0",
]

[project.scripts]
lm-mem = "lm_mem.manage:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_mem"]